<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riel Runner</title>
<link rel="preload" href="assets/fonts/PublicPixel.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/run-summary.css">
<script src="js/volume.js"></script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="crt"></div>

<!-- TOUCH OVERLAY -->
<div id="touch-overlay">
  <!-- Left side -->
  <div class="t-btn" id="btn-jump">▲</div>
  <div class="t-btn" id="btn-left">◄</div>
  <div class="t-btn" id="btn-right">►</div>
  <!-- Right side -->
  <div class="t-btn" id="btn-shoot">SHOOT</div>
  <!-- Top right (pause is drawn on the game canvas) -->
  <div class="t-btn" id="btn-dash">DASH</div>
</div>

<!-- DEATH SCREEN (shown when all 3 lives are lost; filled in by game.js) -->
<div id="death-screen" hidden role="dialog" aria-modal="true" aria-labelledby="death-title">
  <div class="death-panel">
    <div class="death-title" id="death-title">YOU DIED</div>
    <div class="death-sub">CAMPAIGN <span id="death-campaign"></span> HAS FALLEN</div>
    <div class="death-divider"></div>
    <div id="death-summary"></div>
    <div class="death-divider"></div>
    <a class="death-btn" id="death-title-btn" href="index.html">&#9664; &nbsp;RETURN TO TITLE SCREEN</a>
  </div>
</div>

<script src="js/upgrades.js"></script>
<script src="js/cosmetics.js"></script>
<script src="js/run-summary.js"></script>
<script src="js/game.js"></script>
  <script src="js/click-sounds.js"></script>
</body>
</html>
