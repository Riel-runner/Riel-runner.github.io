<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riel Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
<script src="js/volume.js"></script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="crt"></div>

<!-- TOUCH OVERLAY -->
<div id="touch-overlay">
  <!-- Left side -->
  <div class="t-btn" id="btn-jump">▲</div>
  <div class="t-btn" id="btn-left">◄</div>
  <div class="t-btn" id="btn-right">►</div>
  <!-- Right side -->
  <div class="t-btn" id="btn-shoot">SHOOT</div>
  <!-- Top right -->
  <div class="t-btn" id="btn-dash">DASH</div>
  <div class="t-btn" id="btn-pause">⏸</div>
</div>

<script src="js/game.js"></script>
  <script src="js/click-sounds.js"></script>
</body>
</html>
