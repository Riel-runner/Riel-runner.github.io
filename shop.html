<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riel Runner — Shop</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="assets/fonts/PublicPixel.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/shop.css">
<script src="js/volume.js"></script>
</head>
<body>

<div class="purchase-flash" id="purchase-flash"></div>

<div class="page">

  <div class="page-title">SHOP</div>
  <div class="level-badge">LEVEL <span id="level-display">—</span> COMPLETE</div>
  <div class="divider"></div>

  <!-- Wallet -->
  <div class="wallet-bar">
    <div class="wallet-left">
      <div class="coin-icon"></div>
      <div>
        <div class="wallet-label">YOUR RIELS</div>
        <div class="wallet-unit">CAMBODIAN RIEL (KHR)</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div class="wallet-amount" id="riels-display">0</div>
      <div class="wallet-unit">KHR</div>
    </div>
  </div>

  <!-- Stats row -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-card-label">YOUR HP</div>
      <div class="stat-card-value green" id="hp-display">150</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">LIVES</div>
      <div class="stat-card-value" id="lives-display">&#9829;&#9829;&#9829;</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">UPGRADES</div>
      <div class="stat-card-value gold" id="upgrades-display">0</div>
    </div>
  </div>

  <!-- Shop items (built by js/shop.js from js/upgrades.js) -->
  <div class="shop-section-label">&#9632; AVAILABLE UPGRADES</div>
  <div class="shop-section-note">EACH UPGRADE MAXES OUT AT LEVEL 10 AND COSTS MORE EVERY LEVEL.</div>
  <div class="upg-grid" id="upgrade-list"></div>

  <!-- Continue -->
  <div class="continue-section">
    <button class="btn-continue" onclick="continueToGame()">
      CONTINUE &#9658;
    </button>
    <div class="skip-note">YOU CAN SAVE YOUR RIELS FOR LATER</div>
  </div>

  <!-- Shop navigation -->
  <nav class="shop-utility-nav" aria-label="Shop navigation">
    <a class="shop-utility-btn" href="index.html">TITLE SCREEN</a>
    <a class="shop-utility-btn" href="settings.html?returnTo=upgrade-shop">SETTINGS</a>
  </nav>

</div>

<div class="toast" id="toast"></div>
<div class="version">V7 RIEL RUNNER</div>

<script src="js/upgrades.js"></script>
<script src="js/shop.js"></script>
  <script src="js/click-sounds.js"></script>
</body>
</html>
