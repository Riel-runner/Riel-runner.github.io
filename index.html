<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riel Runner</title>
<link rel="preload" href="assets/fonts/PublicPixel.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/index.css">
<script src="js/volume.js"></script>
<script src="js/intro-once.js"></script>
</head>
<body>

<video id="intro-video" src="KrrishyBoy studios intro.mp4" muted playsinline autoplay preload="auto" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:9999;background:black;"></video>
<canvas id="bg-canvas"></canvas>
<div class="overlay"></div>
<div class="scanlines"></div>

<div class="container">
  <div class="title-block">
    <div class="title-top">&#9632; ARCADE &#9632;</div>
    <div class="title-main">RIEL<br>RUNNER</div>
    <div class="title-sub">100 LEVELS &nbsp;&#183;&nbsp; 10 BOSSES &nbsp;&#183;&nbsp; 1 GUN</div>
  </div>

  <div class="tagline-row">
    <div class="coin-dot"></div>
    <div class="coin-dot"></div>
    <div class="coin-label">CAN YOU HANDLE 100 LEVELS?</div>
    <div class="coin-dot"></div>
    <div class="coin-dot"></div>
  </div>

  <div class="stat-row">
    MOST RIELS EVER: <span id="best-riels">---</span>
  </div>

  <div class="btn-group">
    <!-- Icons: matching 8x8 pixel art, all the same size (.btn-icon) -->
    <a class="btn btn-play" href="level-select.html">
      <svg class="btn-icon blink" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor">
        <rect x="1" y="0" width="2" height="8"/><rect x="3" y="1" width="2" height="6"/>
        <rect x="5" y="2" width="1" height="4"/><rect x="6" y="3" width="1" height="2"/>
      </svg> &nbsp; PLAY
    </a>
    <a class="btn btn-secondary" href="shop.html?from=menu">
      <svg class="btn-icon" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor">
        <rect x="0" y="0" width="2" height="1"/><rect x="1" y="1" width="7" height="1"/>
        <rect x="1" y="2" width="6" height="1"/><rect x="2" y="3" width="5" height="2"/>
        <rect x="2" y="5" width="6" height="1"/>
        <rect x="2" y="7" width="2" height="1"/><rect x="6" y="7" width="2" height="1"/>
      </svg> &nbsp; SHOP
    </a>
    <a class="btn btn-secondary" href="settings.html">
      <svg class="btn-icon" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor">
        <rect x="3" y="0" width="2" height="1"/><rect x="1" y="1" width="6" height="1"/>
        <rect x="1" y="2" width="2" height="1"/><rect x="5" y="2" width="2" height="1"/>
        <rect x="0" y="3" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/>
        <rect x="1" y="5" width="2" height="1"/><rect x="5" y="5" width="2" height="1"/>
        <rect x="1" y="6" width="6" height="1"/><rect x="3" y="7" width="2" height="1"/>
      </svg> &nbsp; SETTINGS
    </a>
    <a class="btn btn-secondary" href="credits.html">
      <svg class="btn-icon" viewBox="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges" fill="currentColor">
        <rect x="2" y="0" width="4" height="3"/>
        <rect x="1" y="4" width="6" height="1"/>
        <rect x="0" y="5" width="8" height="3"/>
      </svg> &nbsp; CREDITS
    </a>
  </div>

  <div class="pixel-border"></div>
</div>

<div class="version">V6 &nbsp; RIEL RUNNER</div>

<script src="js/index.js"></script>

  <script src="js/music-continue.js"></script>
  <script src="js/click-sounds.js"></script>
</body>
</html>
